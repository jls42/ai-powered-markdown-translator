# Mises à jour de version automatiques.
#
# Sans ce fichier, GitHub n'active QUE les « security updates » : Dependabot ne
# propose alors une PR que pour une dépendance visée par une CVE. C'est ce qui
# s'est passé ici — urllib3 et idna ont bien été bumpés, mais `openai` a dérivé
# de 2.54 à 3.6 et `anthropic` de 0.125 à 1.2 sans qu'aucune alerte ne parte,
# `certifi` accumulant au passage deux ans de retard sur son magasin de CA.
#
# Les « version updates » configurées ci-dessous couvrent ce trou.

version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    # Quotidien, parce que les mineures et correctifs se fusionnent seuls
    # (.github/workflows/dependabot-auto-merge.yml) : le coût d'une PR n'est
    # plus une revue humaine, et une version absorbée en quatre jours au plus
    # ne laisse pas au retard le temps de s'installer.
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Paris
    # Une version n'est proposée que trois jours après sa publication. C'est le
    # défaut de GitHub depuis le 2026-07-14, écrit ici parce que le délai du gate
    # en dépend : GRACE_DAYS de scripts/check-deps-fresh.sh vaut ce
    # refroidissement + la cadence ci-dessus + 1 jour de marge, égalité vérifiée
    # par scripts/tests/test_pypi_versions.py. Le délai protège aussi la fusion
    # automatique : c'est le temps qu'une version compromise ou cassée soit
    # repérée avant d'atteindre le dépôt — la raison qu'en donne GitHub. Les
    # security updates, elles, n'attendent pas.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    # requirements.txt est la fermeture transitive ENTIÈREMENT ÉPINGLÉE. Sans
    # filtre, Dependabot y bumpe des paquets transitifs pris isolément, qui
    # violent les contraintes de leur parent — deux cas observés :
    #   - pydantic_core 2.46.5 → 2.48.0, incompatible avec pydantic==2.13.5
    #     (« ResolutionImpossible » à l'installation) ;
    #   - websockets 16.1.1 → 17.1, alors que google-genai==2.20.0 exige
    #     websockets<17.0.
    #
    # `dependency-type: direct` NE SUFFIT PAS, et c'est mesuré : Dependabot a
    # rouvert le cas pydantic_core (PR #17) alors que ce filtre était actif. Sur
    # un fichier entièrement épinglé et sans manifeste séparé, il n'a aucun
    # graphe de dépendances — chaque ligne du fichier est « directe » de son
    # point de vue. Le filtre n'a donc rien à discriminer.
    #
    # D'où une allowlist NOMMÉE, qui reprend les dépendances réellement
    # importées par le paquet src/aipmt/, plus certifi (magasin de CA, enjeu de
    # sécurité) et les quatre outils de requirements-dev.txt. Les transitifs
    # suivent leur parent ; leur mise à niveau passe par la régénération
    # complète du fichier, décrite dans CLAUDE.md.
    #
    # À garder aligné avec DIRECT_DEPS de scripts/check-deps-fresh.sh, qui
    # applique la même liste au gate de fin de travail.
    allow:
      - dependency-name: openai
      - dependency-name: anthropic
      - dependency-name: mistralai
      - dependency-name: google-genai
      - dependency-name: langdetect
      - dependency-name: python-dotenv
      - dependency-name: certifi
      - dependency-name: detect-secrets
      - dependency-name: pip-audit
      - dependency-name: mypy
      - dependency-name: lizard
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      # Le bruit est l'ennemi de la mise à jour : un patch bump par PR finit
      # ignoré. Les mineures et correctifs partent groupés — une PR par jour au
      # plus, que la CI valide en bloc et qui se fusionne seule quand elle est
      # verte.
      routine:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      # Les majeures restent SÉPARÉES et non groupées, et ne sont JAMAIS
      # fusionnées automatiquement : chacune peut casser le code de façon
      # invisible à la doc. Deux précédents mesurés dans ce dépôt : anthropic ≥
      # 1.0 refuse côté client un appel non-streamé à max_tokens élevé, et
      # google-genai a changé toute la surface d'appel. Une majeure exige une
      # validation par appel réel, provider par provider.
      # (Aucun `update-types` ici : le groupe ne capte que ce qui reste.)
    # Aucune exclusion. Toute `ignore:` ajoutée ici doit nommer la raison ET la
    # condition de levée — une exclusion sans date de péremption est la façon la
    # plus discrète de recréer le retard qu'on vient de corriger.

  # Hebdomadaire et JAMAIS fusionné automatiquement : une action s'exécute dans
  # les workflows, à côté de SONAR_TOKEN et du jeton OIDC qui publie sur PyPI.
  # Une action compromise qui se fusionnerait seule aurait accès à la
  # publication du paquet ; la fusion automatique se limite donc à pip.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"

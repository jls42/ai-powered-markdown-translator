name: Publier sur PyPI

# Déclenché par la publication d'une GitHub Release — c'est-à-dire par la phase 2
# de `release.sh --tag-only`, qui tague `main` puis crée la Release. Le tag seul
# ne suffit pas volontairement : il existe des tags de test, et une publication
# PyPI est IRRÉVERSIBLE (un numéro de version consommé ne se réutilise jamais).
#
# `workflow_dispatch` reste disponible pour republier après un échec réseau,
# ou pour viser TestPyPI avant le vrai coup.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: "Dépôt cible"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:
  build:
    name: Construire les artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Construire wheel et sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Vérifier les métadonnées
        run: |
          # `twine check` valide le rendu du long_description : un README que
          # PyPI refuse de rendre est accepté à l'upload puis affiché en texte
          # brut, ce qui ne se voit qu'après coup — et après coup, il est trop
          # tard pour corriger sans consommer un numéro de version.
          python -m twine check --strict dist/*

      - name: La version du paquet correspond-elle au tag ?
        if: github.event_name == 'release'
        env:
          # Le nom du tag passe par l'environnement et non par une
          # interpolation directe dans le shell : c'est une chaîne contrôlée
          # par qui crée la release, donc à ne pas concaténer dans du code.
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          python - <<'EOF'
          import os
          import sys
          import tomllib

          tag = os.environ["TAG_NAME"].lstrip("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if tag != version:
              sys.exit(f"✗ tag {tag!r} != version du paquet {version!r} — publication refusée")
          print(f"✓ tag et paquet annoncent {version}")
          EOF

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Téléverser
    needs: build
    runs-on: ubuntu-latest
    # Publication par Trusted Publishing (OIDC) : aucun jeton d'API n'est
    # stocké dans le dépôt. Le jeton d'identité est émis par GitHub pour CE
    # workflow de CE dépôt, et PyPI le vérifie. Un secret volé n'existe pas
    # s'il n'y a pas de secret.
    #
    # Configuration unique, côté PyPI → Publishing → Add a new publisher :
    #   owner = jls42 | repository = ai-powered-markdown-translator
    #   workflow = publish.yml | environment = pypi (resp. testpypi)
    environment:
      name: ${{ github.event_name == 'release' && 'pypi' || inputs.target }}
    permissions:
      id-token: write # exigé par l'échange OIDC
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || '' }}

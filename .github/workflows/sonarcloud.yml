name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Les PR ouvertes par Dependabot n'ont PAS accès aux secrets du dépôt :
    # GitHub les isole dans un scope `dependabot` distinct. `SONAR_TOKEN` y
    # arrive donc vide et le scanner échoue en 403 sur api.sonarcloud.io, avec
    # un message qui accuse le token — un échec structurel, sans rapport avec le
    # contenu de la PR, et qui bloquait les six premières PR de Dependabot.
    #
    # Analyser un bump de dépendance n'apporte de toute façon rien à Sonar : ces
    # PR ne touchent aucun fichier source. On saute le job plutôt que de le
    # laisser rouge en permanence — un check durablement rouge cesse d'être lu.
    # L'analyse a bien lieu au push sur main, après merge.
    #
    # Alternative si l'analyse par PR devient nécessaire : ajouter SONAR_TOKEN
    # dans Settings → Secrets → Dependabot (scope distinct des secrets Actions).
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install coverage

      - name: Run tests with coverage
        run: |
          # Agrège les rc pour que les deux suites tournent ET que coverage xml
          # soit toujours généré (sinon SonarCloud ne reçoit aucune donnée si la
          # 1re suite échoue). Aligné sur scripts/run-unittest.sh.
          set +e
          rc=0
          coverage run --source=src,scripts -m unittest discover tests || rc=$?
          coverage run --append --source=src,scripts -m unittest discover scripts/tests || rc=$?
          coverage xml -o coverage.xml
          exit "$rc"

      # `coverage run --source=module_absent` n'échoue PAS : il émet un
      # « CoverageWarning: Module ... was never imported » sur stderr, unittest
      # sort en 0, et `coverage xml` produit quand même un rapport — amputé.
      # Rien dans le step ci-dessus ne transforme cet avertissement en échec.
      # Un simple renommage de fichier ferait donc passer le rapport de 2214 à
      # 440 statements, et le projet apparaîtrait sain parce qu'il ne serait
      # presque plus analysé. Mesuré le 2026-09-08 : le paquet pèse 1774 des
      # 2214 statements.
      #
      # Trois planchers, parce qu'un seul avait un angle mort :
      #   - le total attrape un effondrement global ;
      #   - la somme sous src/aipmt/ attrape la sortie du paquet de --source,
      #     sans coder ni un nom de fichier ni une taille de module (l'ancien
      #     plancher « plus gros fichier ≥ 1000 » supposait un module unique) ;
      #   - chaque module SUIVI du paquet doit avoir été exécuté : avec
      #     --source sur un répertoire, coverage liste aussi un module jamais
      #     importé, avec zéro ligne touchée — « présent dans le rapport » ne
      #     prouve donc pas « mesuré ». __main__.py est exclu : il ne s'exécute
      #     que par sous-processus, hors de portée de coverage.
      - name: Plancher de couverture (le rapport doit être complet)
        run: |
          python - <<'EOF'
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          FLOOR = 1000
          PACKAGE_FLOOR = 1550
          classes = ET.parse("coverage.xml").getroot().findall(".//class")
          per_file = {}
          executed = {}
          for c in classes:
              lines = c.findall("lines/line")
              per_file[c.get("filename")] = len(lines)
              executed[c.get("filename")] = sum(1 for line in lines if int(line.get("hits", "0")) > 0)
          total = sum(per_file.values())
          package_total = sum(n for f, n in per_file.items() if f.startswith("src/aipmt/"))

          print(f"{total} statements dans {len(per_file)} fichier(s), {package_total} sous src/aipmt/")
          for name, n in sorted(per_file.items(), key=lambda kv: -kv[1]):
              print(f"  {n:5d}  {name}  ({executed[name]} exécutées)")

          tracked = subprocess.run(
              ["git", "ls-files", "src/aipmt/*.py"], capture_output=True, text=True, check=True
          ).stdout.split()
          # Un module sans instruction (docstring seule, ex. providers/__init__.py)
          # n'a rien à exécuter : seul un module qui a des lignes et zéro exécutée
          # est « jamais mesuré ». Mesuré en CI : le premier plancher échouait sur
          # un __init__ réduit à sa docstring.
          silent = [
              f for f in tracked
              if not f.endswith("__main__.py")
              and (f not in per_file or (per_file[f] > 0 and executed.get(f, 0) == 0))
          ]

          if total < FLOOR:
              sys.exit(f"✗ {total} statements seulement (plancher {FLOOR}) : le rapport est amputé.")
          if package_total < PACKAGE_FLOOR:
              sys.exit(
                  f"✗ {package_total} statements sous src/aipmt/ (plancher {PACKAGE_FLOOR}) : "
                  "le paquet est sorti de --source."
              )
          if silent:
              sys.exit(f"✗ module(s) du paquet jamais exécutés par la suite : {' '.join(silent)}")
          print(f"✓ rapport complet — {package_total} statements mesurés sur {len(tracked)} modules du paquet")
          EOF

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

name: SonarCloud

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Les PR ouvertes par Dependabot n'ont PAS accès aux secrets du dépôt :
    # GitHub les isole dans un scope `dependabot` distinct. `SONAR_TOKEN` y
    # arrive donc vide et le scanner échoue en 403 sur api.sonarcloud.io, avec
    # un message qui accuse le token — un échec structurel, sans rapport avec le
    # contenu de la PR, et qui bloquait les six premières PR de Dependabot.
    #
    # Analyser un bump de dépendance n'apporte de toute façon rien à Sonar : ces
    # PR ne touchent aucun fichier source. On saute le job plutôt que de le
    # laisser rouge en permanence — un check durablement rouge cesse d'être lu.
    # L'analyse a bien lieu au push sur main, après merge.
    #
    # Alternative si l'analyse par PR devient nécessaire : ajouter SONAR_TOKEN
    # dans Settings → Secrets → Dependabot (scope distinct des secrets Actions).
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clones should be disabled for a better relevancy of analysis
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install coverage

      - name: Run tests with coverage
        run: |
          # Agrège les rc pour que les deux suites tournent ET que coverage xml
          # soit toujours généré (sinon SonarCloud ne reçoit aucune donnée si la
          # 1re suite échoue). Aligné sur scripts/run-unittest.sh.
          set +e
          rc=0
          coverage run --source=src,scripts -m unittest discover tests || rc=$?
          coverage run --append --source=src,scripts -m unittest discover scripts/tests || rc=$?
          coverage xml -o coverage.xml
          exit "$rc"

      # `coverage run --source=module_absent` n'échoue PAS : il émet un
      # « CoverageWarning: Module ... was never imported » sur stderr, unittest
      # sort en 0, et `coverage xml` produit quand même un rapport — amputé.
      # Rien dans le step ci-dessus ne transforme cet avertissement en échec.
      # Un simple renommage de fichier ferait donc passer le rapport de 1453 à
      # 141 statements, et le projet apparaîtrait sain parce qu'il ne serait
      # presque plus analysé. Mesuré : le module principal pèse 1312 des 1453
      # statements, soit 90 % du rapport.
      - name: Plancher de couverture (le rapport doit être complet)
        run: |
          python - <<'EOF'
          import sys
          import xml.etree.ElementTree as ET

          FLOOR = 1000
          classes = ET.parse("coverage.xml").getroot().findall(".//class")
          per_file = {c.get("filename"): len(c.findall("lines/line")) for c in classes}
          total = sum(per_file.values())
          biggest, biggest_n = max(per_file.items(), key=lambda kv: kv[1], default=("(aucun)", 0))

          print(f"{total} statements dans {len(per_file)} fichier(s)")
          for name, n in sorted(per_file.items(), key=lambda kv: -kv[1]):
              print(f"  {n:5d}  {name}")

          # Deux planchers plutôt qu'un : le total attrape un effondrement
          # global, le plus gros fichier attrape la sortie du module principal
          # du périmètre — sans coder son chemin en dur, donc sans devoir être
          # réécrit à chaque réorganisation du dépôt.
          if total < FLOOR:
              sys.exit(f"✗ {total} statements seulement (plancher {FLOOR}) : le rapport est amputé.")
          if biggest_n < FLOOR:
              sys.exit(
                  f"✗ le plus gros fichier mesuré est {biggest} avec {biggest_n} statements "
                  f"(plancher {FLOOR}) : le module principal est sorti de --source."
              )
          print(f"✓ rapport complet — {biggest} pèse {biggest_n} statements")
          EOF

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

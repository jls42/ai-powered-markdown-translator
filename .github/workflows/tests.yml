name: Tests

# Raison d'être : `requires-python = ">=3.11"` est une PROMESSE PUBLIQUE, que
# seule l'exécution prouve. La matrice va du plancher (la plus ancienne version
# maintenue par CPython) à la dernière version publiée ; à chaque nouvelle
# version de Python, l'ajouter ici, dans `sonar-project.properties`, dans les
# classifieurs de pyproject.toml, dans REQUIRED_CHECKS de
# dependabot-auto-merge.yml et dans le ruleset de `main`.
#
# Sans elle, `sonar-project.properties` annonçait déjà 3.10-3.12 sans que
# personne ne l'ait jamais vérifié — une contradiction interne que la
# publication aurait rendue publique.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  matrix:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      # Toutes les versions vont au bout : savoir que 3.11 casse ET que 3.12
      # passe vaut mieux qu'un seul échec qui annule les autres.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer le paquet et ses dépendances
        run: |
          # `pip install .` et non `-r requirements.txt` : c'est le CONTRAT
          # PUBLIC qu'on veut exercer sur chaque version, bornes basses
          # comprises. Le lock est vérifié par ailleurs (deps-check.yml).
          python -m pip install --upgrade pip
          python -m pip install .

      - name: La commande installée répond
        run: |
          aipmt --help > /dev/null
          python -m aipmt --help > /dev/null

      - name: Suite de tests
        run: |
          # Les tests importent `aipmt` depuis `src/` via sys.path ; ils
          # n'exigent donc pas le paquet installé, mais l'installation
          # ci-dessus garantit que les dépendances sont présentes.
          python -m unittest discover tests
          python -m unittest discover scripts/tests
